<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>CleanChat — Generate Icons</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 32px; background: #0d0d1a; color: #e2e8f0; }
    h2 { color: #a78bfa; margin-bottom: 8px; }
    p { color: #64748b; margin-bottom: 20px; font-size: 14px; }
    canvas { border: 1px solid #333; margin: 8px; }
    #status { margin-top: 16px; color: #22c55e; font-size: 14px; }
    .previews { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
    label { font-size: 11px; color: #64748b; display: block; text-align: center; }
  </style>
</head>
<body>
  <h2>CleanChat Icon Generator</h2>
  <p>Opens this file in Chrome to auto-generate and download all 4 icon sizes.<br/>
     Move the downloaded <code>icon*.png</code> files into the <code>icons/</code> folder.</p>
  <div class="previews" id="previews"></div>
  <div id="status">Generating icons…</div>
  <script>
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
      <rect width="128" height="128" rx="22" fill="#0d0d1a"/>
      <path d="M18 32 Q18 20 30 20 H98 Q110 20 110 32 V78 Q110 90 98 90 H70 L52 110 L52 90 H30 Q18 90 18 78 Z" fill="#8b5cf6"/>
      <rect x="36" y="44" width="56" height="7" rx="3.5" fill="white" opacity="0.95"/>
      <rect x="44" y="57" width="40" height="7" rx="3.5" fill="white" opacity="0.95"/>
      <rect x="54" y="70" width="20" height="7" rx="3.5" fill="white" opacity="0.95"/>
    </svg>`;

    const sizes = [16, 32, 48, 128];
    const blob = new Blob([svg], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const img = new Image();
    let done = 0;

    img.onload = () => {
      sizes.forEach((size, i) => {
        setTimeout(() => {
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, size, size);

          // Preview
          const wrap = document.createElement('div');
          const preview = canvas.cloneNode();
          preview.getContext('2d').drawImage(img, 0, 0, size, size);
          const lbl = document.createElement('label');
          lbl.textContent = `${size}×${size}`;
          wrap.appendChild(preview);
          wrap.appendChild(lbl);
          document.getElementById('previews').appendChild(wrap);

          // Download
          const a = document.createElement('a');
          a.download = `icon${size}.png`;
          a.href = canvas.toDataURL('image/png');
          a.click();

          done++;
          if (done === sizes.length) {
            URL.revokeObjectURL(url);
            document.getElementById('status').innerHTML =
              `✅ Done! Move the 4 downloaded <code>icon*.png</code> files into the <code>icons/</code> folder, then load the extension in Chrome.`;
          }
        }, i * 600);
      });
    };

    img.src = url;
  </script>
</body>
</html>
